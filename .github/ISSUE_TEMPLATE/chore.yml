name: Chore / Refactor
description: Track maintenance, refactoring, or cleanup work.
title: "[Chore]: "
labels: ["type: chore"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to change?
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome should this chore/refactor achieve?
    validations:
      required: true
  - type: textarea
    id: subtasks
    attributes:
      label: Subtasks
      value: |
        - [ ] 
        - [ ] 
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes

