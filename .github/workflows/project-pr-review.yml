name: GitBan Project - PR to In Review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  move-linked-issues:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Check out automation scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Move linked issues to review
        uses: actions/github-script@v9
        env:
          GITBAN_PROJECT_NUMBER: ${{ vars.GITBAN_PROJECT_NUMBER }}
          GITBAN_PROJECT_OWNER: ${{ vars.GITBAN_PROJECT_OWNER }}
          GITBAN_PROJECT_OWNER_TYPE: ${{ vars.GITBAN_PROJECT_OWNER_TYPE }}
          GITBAN_STATUS_FIELD: ${{ vars.GITBAN_STATUS_FIELD }}
          GITBAN_IN_REVIEW_STATUS: ${{ vars.GITBAN_IN_REVIEW_STATUS }}
        with:
          github-token: ${{ secrets.GITBAN_PROJECT_TOKEN || secrets.GITBAN_PAT || secrets.BRANCHFLOW_PAT || github.token }}
          script: |
            const automation = require("./.github/scripts/project-automation.js")({ github, context, core });
            await automation.moveLinkedIssuesToReview();
