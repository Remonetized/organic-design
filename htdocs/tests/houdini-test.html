<html>
<head>
  <style>
    #box {
      --box-colour: #ff0000;

      width: 200px;
      height: 200px;
      background: var(--box-colour);
      transition: --box-colour 1s;
    }

    #box:hover {
      --box-colour: #ffff00;
    }
  </style>
</head>
<body>
